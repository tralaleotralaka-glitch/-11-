name: Build Java launcher with game engine

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - '.github/workflows/playable-apk.yml'
      - 'launcher-engine/**'
      - 'scripts/prepare_engine.py'
      - 'scripts/test_prepare_engine.py'
      - 'scripts/check_engine_apk.py'
      - 'scripts/smoke_engine.py'
      - 'android/debug.keystore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: java-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test project overlay
        run: python3 -m unittest discover -s scripts -p test_prepare_engine.py -v
      - name: Checkout pinned open-source engine
        uses: actions/checkout@v4
        with:
          repository: PojavLauncherTeam/PojavLauncher
          ref: 6b0ff501cc5fc8fe79d29ecd2244192a2f66e6c7
          path: .engine-build
          persist-credentials: false
      - name: Fetch official Android Java runtime bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download gladiolus --repo PojavLauncherTeam/PojavLauncher --pattern PojavLauncher.apk --dir dist
          sha256sum dist/PojavLauncher.apk | tee dist/runtime-origin.sha256
          python3 scripts/prepare_engine.py .engine-build dist/PojavLauncher.apk
          cp dist/runtime-origin.sha256 .engine-build/app_pojavlauncher/src/main/assets/runtime-origin.sha256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Build launcher, native bridges and Java support components
        working-directory: .engine-build
        run: |
          bash scripts/languagelist_updater.sh
          gradle :app_pojavlauncher:assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME_8_X64,$JAVA_HOME_17_X64"
      - name: Validate runtime and renderer contents
        run: |
          cp .engine-build/app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk dist/JavaLauncher-0.4.apk
          python3 scripts/check_engine_apk.py dist/JavaLauncher-0.4.apk
          sha256sum dist/JavaLauncher-0.4.apk > dist/JavaLauncher-0.4.apk.sha256
      - name: Enable KVM for emulator smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check launcher and engine menus on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/smoke_engine.py dist/JavaLauncher-0.4.apk
      - name: Package corresponding engine source and project modifications
        run: |
          mkdir -p dist/source/project
          git archive HEAD | tar -x -C dist/source/project
          git -C .engine-build archive HEAD | tar -x -C dist/source
          cp dist/runtime-origin.sha256 dist/source/
          cd dist/source
          zip -qr ../JavaLauncher-0.4-sources.zip .
      - name: Upload APK, sources and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JavaLauncher-0.4-build
          path: |
            dist/JavaLauncher-0.4*
            dist/*smoke*
            dist/runtime-origin.sha256
          if-no-files-found: warn
      - name: Publish engine integration build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view java-launcher-0.4 >/dev/null 2>&1; then
            gh release edit java-launcher-0.4 --prerelease --notes-file launcher-engine/RELEASE.md
          else
            gh release create java-launcher-0.4 --target "$GITHUB_SHA" --prerelease --title "Java Launcher 0.4 — Pojav engine integration" --notes-file launcher-engine/RELEASE.md
          fi
          gh release upload java-launcher-0.4 dist/JavaLauncher-0.4.apk dist/JavaLauncher-0.4.apk.sha256 dist/JavaLauncher-0.4-sources.zip --clobber
