name: Build APK

on:
  push:
    branches: [ main, 'arena/**' ]
  workflow_dispatch:
  repository_dispatch:
    types: [ build-apk ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pack web assets
        run: bash scripts/pack_assets.sh

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/JavaLauncher-prototype.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JavaLauncher-prototype
          path: dist/JavaLauncher-prototype.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish prototype (not a playable launcher yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          Собственный нативный Java Launcher — прототип 0.1, НЕ готовый игровой лаунчер.

          Работает: каталог релизов Mojang, выбор версии, загрузка описания и client.jar с проверкой SHA-1.
          НЕ реализовано: вход Microsoft, Android JVM, графический слой, библиотеки/ресурсы и запуск игры.
          Этот APK пока НЕ запускает Minecraft. Не содержит Minecraft и не открывает Bedrock.
          Установка поверх Windows11.apk меняет главный экран приложения на прототип лаунчера.
          Android 7.0+. Исходники и сборка находятся в текущей ветке.
          EOF
          if gh release view java-launcher-prototype --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit java-launcher-prototype --repo "$GITHUB_REPOSITORY" --prerelease --notes-file /tmp/notes.md
          else
            gh release create java-launcher-prototype --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Java Launcher 0.1 — прототип, запуск игры ещё не реализован" --notes-file /tmp/notes.md
          fi
          gh release upload java-launcher-prototype dist/JavaLauncher-prototype.apk --repo "$GITHUB_REPOSITORY" --clobber
