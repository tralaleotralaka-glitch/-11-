name: Build APK

on:
  push:
    branches: [ main, 'arena/**' ]
  workflow_dispatch:
  repository_dispatch:
    types: [ build-apk ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pack web assets
        run: bash scripts/pack_assets.sh

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Windows11.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows11-APK
          path: dist/Windows11.apk
          if-no-files-found: error
          retention-days: 90

      - name: Commit APK into the repository
        run: |
          git config user.name "apk-bot"
          git config user.email "apk-bot@users.noreply.github.com"
          cp dist/Windows11.apk Windows11.apk
          git add Windows11.apk
          if git diff --cached --quiet; then
            echo "APK не изменился — коммит не требуется"
          else
            git commit -m "Сборка APK [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          Готовый APK: Windows 11 (веб-клон) в WebView-обёртке.

          ## Установка
          1. Скачайте **Windows11.apk** ниже (раздел Assets)
          2. Откройте файл на Android-телефоне
          3. Разрешите установку из неизвестных источников, если спросит
          4. Значок «Windows 11» появится в меню приложений

          Требуется Android 7.0+ (API 24). Размер ~2 МБ. Обновляется автоматически при каждом push.
          EOF
          sed -i 's/^          //' /tmp/notes.md
          gh release view apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create apk-latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Windows 11 — APK (скачать)" \
            --notes-file /tmp/notes.md
          gh release upload apk-latest dist/Windows11.apk --repo "$GITHUB_REPOSITORY" --clobber
          echo "Release URL: $(gh release view apk-latest --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
